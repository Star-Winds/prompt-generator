<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>AI Prompt 生成器</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 4px;
      text-align: center;
    }
    .subtitle {
      font-size: 0.9rem;
      color: #555;
      text-align: center;
      margin-bottom: 16px;
    }
    .card {
      background: #ffffff;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      margin-bottom: 16px;
    }
    .field {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 4px;
    }
    textarea, select, input {
      width: 100%;
      box-sizing: border-box;
      border-radius: 10px;
      border: 1px solid #d4d4d4;
      font-size: 0.9rem;
      padding: 8px;
      background: #ffffff;
    }
    textarea {
      min-height: 80px;
      resize: vertical;
    }
    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    button {
      width: 100%;
      border: none;
      border-radius: 999px;
      padding: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    .primary-btn {
      background: #2563eb;
      color: white;
    }
    .secondary-btn {
      background: #e5e7eb;
      color: #111827;
    }
    .output-area {
      margin-top: 8px;
    }
    .tips {
      font-size: 0.8rem;
      color: #6b7280;
      margin-top: 4px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>AI Prompt 生成器</h1>
    <div class="subtitle">把模糊想法变成结构化、可复用的高质量 Prompt。</div>

    <div class="card">
      <div class="field">
        <label for="task">1. 任务描述</label>
        <textarea id="task" placeholder="例如：为考研生设计 7 天复习计划……"></textarea>
      </div>

      <div class="row" style="margin-bottom: 8px;">
        <div class="field" style="flex:1;">
          <label for="style">2. 风格</label>
          <select id="style">
            <option value="严谨、结构化、条理清晰">严谨结构化</option>
            <option value="口语化、亲切、易懂">口语易懂</option>
            <option value="有创意、有比喻、有故事感">创意故事感</option>
          </select>
        </div>
        <div class="field" style="flex:1;">
          <label for="length">3. 长度</label>
          <select id="length">
            <option value="尽量简短，只保留关键要点">简短</option>
            <option value="适中，兼顾完整性与可读性">适中</option>
            <option value="较为详细，可以展开说明和举例">详细</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="audience">4. 目标读者（可选）</label>
        <input id="audience" placeholder="例如：小白 / 大学生 / 行业从业者" />
      </div>

      <div class="field">
        <label for="constraints">5. 约束（可选）</label>
        <textarea id="constraints" placeholder="例如：禁止使用专业术语；每条前加编号……"></textarea>
      </div>

      <button class="primary-btn" id="generateBtn">生成 Prompt</button>
    </div>

    <div class="card">
      <div class="field">
        <label for="output">生成结果</label>
        <textarea id="output" readonly placeholder="这里会显示生成的 Prompt……"></textarea>
      </div>
      <button class="secondary-btn" id="copyBtn">复制 Prompt</button>
      <div class="tips">提示：你可以把高质量 Prompt 收藏起来，形成自己的 Prompt 仓库。</div>
    </div>
  </div>

  <script>
    function buildPrompt(task, style, lengthPref, audience, constraints) {
      let lines = [];
      lines.push("你现在是一名智能助手，请按照下面的要求完成任务。\n");
      lines.push("【任务描述】\n" + task.trim() + "\n");
      lines.push("【输出目标】");
      let t = ["使用" + style + "的表达方式", lengthPref];
      if (audience.trim()) t.push("目标读者：" + audience.trim());
      lines.push("- " + t.join("，") + "\n");
      if (constraints.trim()) {
        lines.push("【必须遵守的约束】");
        constraints.split("\n").map(s=>s.trim()).filter(s=>s).forEach(s=>{
          lines.push("- " + s);
        });
        lines.push("");
      }
      lines.push("【输出格式】");
      lines.push("- 开头给一个 1-2 句概述");
      lines.push("- 使用分层条目（1. 1.1 等）展开细节");
      lines.push("- 最后给一个简短总结\n");
      lines.push("请直接开始输出，不要重复上述说明。");
      return lines.join("\n");
    }

    document.getElementById("generateBtn").onclick = function () {
      let task = task.value.trim();
      if (!task) return alert("请填写任务描述。");
      output.value = buildPrompt(task, style.value, length.value, audience.value, constraints.value);
    };

    document.getElementById("copyBtn").onclick = function () {
      if (!output.value.trim()) return alert("没有可复制的内容。");
      navigator.clipboard.writeText(output.value).then(()=>alert("已复制！")).catch(()=>alert("复制失败，请手动复制"));
    };
  </script>
</body>
</html>
